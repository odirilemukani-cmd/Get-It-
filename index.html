<script>

const SUPABASE_URL =
"https://snjrlhkmixiamgqhfhug.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3jRUAQ88ntmpnA42QwTuew_TJ7NYgFw";


let allProducts = [];
let allShops = [];
let selectedProduct = null;

let shoppingList = [];

let currentCategory = "All";


/* =========================
   SUPABASE
========================= */

async function supabaseFetch(endpoint){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
          "Bearer " + SUPABASE_KEY
        }
      }
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text || "Supabase request failed"
    );
  }

  return response.json();
}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function getProductId(product){

  return (
    product.product_id ??
    product.Product_id ??
    product.id ??
    product.Id ??
    product.ID ??
    product["I'd"]
  );
}


function getProductName(product){

  return (
    product.name ??
    product.Name ??
    product.product_name ??
    product.Product_name ??
    product.product ??
    product.Product ??
    "Unnamed product"
  );
}


function getProductBrand(product){

  return (
    product.brand ??
    product.Brand ??
    "Unknown brand"
  );
}


function getProductSize(product){

  return (
    product.size ??
    product.Size ??
    ""
  );
}


function getProductCategory(product){

  return (
    product.category ??
    product.Category ??
    product.category_name ??
    product.Category_name ??
    "Other"
  );
}


function getShopId(shop){

  return (
    shop.shop_id ??
    shop.Shop_id ??
    shop.id ??
    shop.Id ??
    shop.ID
  );
}


function getShopName(shop){

  return (
    shop.name ??
    shop.Name ??
    shop.shop_name ??
    shop.Shop_name ??
    "Unknown shop"
  );
}


function getShopLocation(shop){

  return (
    shop.location ??
    shop.Location ??
    ""
  );
}


function findShop(shopId){

  return allShops.find(
    shop =>
      String(getShopId(shop)) ===
      String(shopId)
  );
}


function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen =>
      screen.classList.remove("active")
    );

  const screen =
    document.getElementById(id);

  if(screen){
    screen.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const data =
      await supabaseFetch(
        "products?select=*"
      );

    console.log(
      "PRODUCTS LOADED:",
      data
    );

    allProducts =
      Array.isArray(data)
      ? data
      : [];

    displayProducts(
      allProducts
    );

  }catch(error){

    console.error(
      "PRODUCT ERROR:",
      error
    );

    document.getElementById(
      "productsContainer"
    ).innerHTML = `

      <div class="message error">

        <h3>
          Unable to load products
        </h3>

        <p style="margin-top:10px;">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;
  }
}


/* =========================
   LOAD SHOPS
========================= */

async function loadShops(){

  try{

    allShops =
      await supabaseFetch(
        "shops?select=*"
      );

    console.log(
      "SHOPS LOADED:",
      allShops
    );

  }catch(error){

    console.error(
      "SHOP ERROR:",
      error
    );

    allShops = [];
  }
}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products){

  const container =
    document.getElementById(
      "productsContainer"
    );

  if(!container){
    return;
  }

  if(
    !Array.isArray(products) ||
    products.length === 0
  ){

    container.innerHTML = `
      <div class="message">
        No products found.
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "product-card";

    const name =
      getProductName(product);

    const brand =
      getProductBrand(product);

    const size =
      getProductSize(product);

    const category =
      getProductCategory(product);

    card.innerHTML = `

      <h3>
        ${escapeHtml(name)}
      </h3>

      <p>
        🏷️ Brand:
        ${escapeHtml(brand)}
      </p>

      ${
        size
        ? `
          <p>
            📦 Size:
            ${escapeHtml(size)}
          </p>
        `
        : ""
      }

      <p>
        Category:
        ${escapeHtml(category)}
      </p>

      <button
        class="btn compareBtn">
        💰 Compare Prices
      </button>

      <button
        class="btn secondary-btn addBtn">
        🛒 Add to List
      </button>

    `;


    card.addEventListener(
      "click",
      function(){

        openProduct(product);

      }
    );


    card
      .querySelector(".compareBtn")
      .addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          openProduct(product);

        }
      );


    card
      .querySelector(".addBtn")
      .addEventListener(
        "click",
        function(event){

          event.stopPropagation();

          addToShoppingList(
            product
          );

        }
      );


    container.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function(){

      const search =
        this.value
          .toLowerCase()
          .trim();

      const filtered =
        allProducts.filter(product => {

          const name =
            getProductName(product)
              .toLowerCase();

          const brand =
            getProductBrand(product)
              .toLowerCase();

          const size =
            getProductSize(product)
              .toLowerCase();

          return (
            name.includes(search) ||
            brand.includes(search) ||
            size.includes(search)
          );

        });

      displayProducts(filtered);

    }
  );


/* =========================
   CATEGORIES
========================= */

document
  .querySelectorAll(".category-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(
            ".category-btn"
          )
          .forEach(btn =>
            btn.classList.remove("active")
          );

        this.classList.add("active");

        currentCategory =
          this.dataset.category;

        if(
          currentCategory === "All"
        ){

          displayProducts(
            allProducts
          );

          return;
        }

        const filtered =
          allProducts.filter(product => {

            return (
              getProductCategory(product)
                .toLowerCase() ===
              currentCategory.toLowerCase()
            );

          });

        displayProducts(filtered);

      }
    );

  });


/* =========================
   OPEN PRODUCT
========================= */

function openProduct(product){

  selectedProduct =
    product;

  const name =
    getProductName(product);

  const brand =
    getProductBrand(product);

  const size =
    getProductSize(product);

  document.getElementById(
    "detailsContent"
  ).innerHTML = `

    <div class="detail-card">

      <h2>
        ${escapeHtml(name)}
      </h2>

      <p style="margin-top:10px;">
        🏷️ Brand:
        ${escapeHtml(brand)}
      </p>

      ${
        size
        ? `
          <p style="margin-top:8px;">
            📦 Size:
            ${escapeHtml(size)}
          </p>
        `
        : ""
      }

      <button
        class="btn secondary-btn"
        id="detailAdd">
        🛒 Add to Shopping List
      </button>

      <button
        class="btn"
        id="detailCompare">
        💰 Compare Prices
      </button>

    </div>

  `;


  document
    .getElementById("detailAdd")
    .addEventListener(
      "click",
      function(){

        addToShoppingList(
          product
        );

      }
    );


  document
    .getElementById("detailCompare")
    .addEventListener(
      "click",
      function(){

        comparePrices(
          product
        );

      }
    );


  showScreen(
    "detailsScreen"
  );

}


/* =========================
   COMPARE PRICES
========================= */

async function comparePrices(product){

  selectedProduct =
    product;

  const productId =
    getProductId(product);

  if(
    productId === undefined ||
    productId === null ||
    productId === ""
  ){

    document.getElementById(
      "comparisonContent"
    ).innerHTML = `

      <div class="message error">
        Product ID could not be found.
      </div>

    `;

    showScreen(
      "comparisonScreen"
    );

    return;
  }


  document.getElementById(
    "comparisonContent"
  ).innerHTML = `

    <div class="message">
      Loading prices...
    </div>

  `;

  showScreen(
    "comparisonScreen"
  );


  try{

    const prices =
      await supabaseFetch(

        "product_prices" +
        "?select=product_id,shop_id,price" +
        "&product_id=eq." +
        encodeURIComponent(
          String(productId)
        )

      );


    const validPrices =
      Array.isArray(prices)
      ? prices.filter(
          row =>
            row.price !== null &&
            row.price !== undefined &&
            !isNaN(Number(row.price))
        )
      : [];


    validPrices.sort(
      (a,b) =>
        Number(a.price) -
        Number(b.price)
    );


    const name =
      getProductName(product);

    const brand =
      getProductBrand(product);

    const size =
      getProductSize(product);


    if(validPrices.length === 0){

      document.getElementById(
        "comparisonContent"
      ).innerHTML = `

        <div class="message">

          <h2>
            ${escapeHtml(name)}
          </h2>

          <p style="margin-top:10px;">
            No prices available yet.
          </p>

        </div>

      `;

      return;
    }


    let html = `

      <div class="comparison-card">

        <h2>
          💰 Price Comparison
        </h2>

        <p style="margin-top:8px;">
          ${escapeHtml(name)}
        </p>

        <p style="margin-top:5px;">
          🏷️ ${escapeHtml(brand)}
        </p>

        ${
          size
          ? `
            <p style="margin-top:5px;">
              📦 ${escapeHtml(size)}
            </p>
          `
          : ""
        }

      </div>

    `;


    validPrices.forEach(
      (item,index) => {

        const shop =
          findShop(item.shop_id);

        const shopName =
          shop
          ? getShopName(shop)
          : "Unknown shop";

        const location =
          shop
          ? getShopLocation(shop)
          : "";


        html += `

          <div class="
            comparison-card
            ${index === 0 ? "cheapest" : ""}
          ">

            ${
              index === 0
              ? `
                <div class="cheapest-label">
                  🏆 Cheapest price
                </div>
              `
              : ""
            }

            <div class="price-row">

              <div>

                <strong>
                  ${escapeHtml(shopName)}
                </strong>

                ${
                  location
                  ? `
                    <div style="
                      color:#666;
                      margin-top:5px;
                      font-size:14px;
                    ">
                      📍 ${escapeHtml(location)}
                    </div>
                  `
                  : ""
                }

              </div>

              <div class="price">
                P${Number(item.price).toFixed(2)}
              </div>

            </div>

          </div>

        `;

      }
    );


    document.getElementById(
      "comparisonContent"
    ).innerHTML = html;


  }catch(error){

    console.error(
      "PRICE COMPARISON ERROR:",
      error
    );

    document.getElementById(
      "comparisonContent"
    ).innerHTML = `

      <div class="message error">

        <h3>
          Price comparison error
        </h3>

        <p style="margin-top:10px;">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* =========================
   ADD TO SHOPPING LIST
========================= */

function addToShoppingList(product){

  const productId =
    getProductId(product);


  if(
    productId === undefined ||
    productId === null ||
    productId === ""
  ){

    alert(
      "This product does not have a valid ID."
    );

    return;
  }


  const existing =
    shoppingList.find(
      item =>
        String(
          getProductId(item.product)
        ) ===
        String(productId)
    );


  if(existing){

    existing.quantity++;

  }else{

    shoppingList.push({

      product:product,
      quantity:1

    });

  }


  updateListCount();

  alert(
    getProductName(product) +
    " added to your shopping list."
  );

}


/* =========================
   LIST COUNT
========================= */

function updateListCount(){

  const count =
    shoppingList.reduce(
      (total,item) =>
        total + item.quantity,
      0
    );


  document.getElementById(
    "listCount"
  ).textContent = count;

}


/* =========================
   DISPLAY SHOPPING LIST
========================= */

function displayShoppingList(){

  const container =
    document.getElementById(
      "shoppingListContent"
    );


  if(
    shoppingList.length === 0
  ){

    container.innerHTML = `

      <div class="message">

        <h3>
          Your shopping list is empty
        </h3>

        <p style="margin-top:10px;">
          Add products to start building
          your cheapest basket.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML = "";


  shoppingList.forEach(
    (item,index) => {

      const product =
        item.product;

      const card =
        document.createElement("div");

      card.className =
        "basket-card";


      const name =
        getProductName(product);

      const brand =
        getProductBrand(product);

      const size =
        getProductSize(product);


      card.innerHTML = `

        <h3>
          ${escapeHtml(name)}
        </h3>

        <p style="margin-top:7px;">
          🏷️ Brand:
          ${escapeHtml(brand)}
        </p>

        ${
          size
          ? `
            <p style="margin-top:5px;">
              📦 Size:
              ${escapeHtml(size)}
            </p>
          `
          : ""
        }

        <div class="quantity-control">

          <button class="minus">
            −
          </button>

          <span class="quantity">
            ${item.quantity}
          </span>

          <button class="plus">
            +
          </button>

        </div>

        <button
          class="remove-btn">
          Remove
        </button>

      `;


      card
        .querySelector(".minus")
        .addEventListener(
          "click",
          function(){

            if(item.quantity > 1){

              item.quantity--;

            }

            displayShoppingList();

          }
        );


      card
        .querySelector(".plus")
        .addEventListener(
          "click",
          function(){

            item.quantity++;

            displayShoppingList();

          }
        );


      card
        .querySelector(".remove-btn")
        .addEventListener(
          "click",
          function(){

            shoppingList.splice(
              index,
              1
            );

            updateListCount();

            displayShoppingList();

          }
        );


      container.appendChild(card);

    }
  );


  const cheapestButton =
    document.createElement("button");

  cheapestButton.className =
    "btn secondary-btn";

  cheapestButton.textContent =
    "🏆 Find Cheapest Basket";


  cheapestButton.addEventListener(
    "click",
    findCheapestBasket
  );


  container.appendChild(
    cheapestButton
  );

}


/* =========================
   FIND CHEAPEST BASKET
========================= */

async function findCheapestBasket(){

  if(
    shoppingList.length === 0
  ){

    return;
  }


  document.getElementById(
    "basketContent"
  ).innerHTML = `

    <div class="message">

      <h3>
        🔎 Comparing your basket...
      </h3>

      <p style="margin-top:10px;">
        Checking prices across shops.
      </p>

    </div>

  `;


  showScreen(
    "basketScreen"
  );


  try{

    const priceData = [];


    /*
      Get prices for every selected
      product.
    */

    for(
      const item of shoppingList
    ){

      const product =
        item.product;

      const productId =
        getProductId(product);


      if(
        productId === undefined ||
        productId === null ||
        productId === ""
      ){

        continue;

      }


      const prices =
        await supabaseFetch(

          "product_prices" +
          "?select=product_id,shop_id,price" +
          "&product_id=eq." +
          encodeURIComponent(
            String(productId)
          )

        );


      priceData.push({

        product:product,

        quantity:item.quantity,

        prices:
          Array.isArray(prices)
          ? prices.filter(
              row =>
                row.price !== null &&
                row.price !== undefined &&
                !isNaN(Number(row.price))
            )
          : []

      });

    }


    calculateBasket(
      priceData
    );


  }catch(error){

    console.error(
      "BASKET ERROR:",
      error
    );


    document.getElementById(
      "basketContent"
    ).innerHTML = `

      <div class="message error">

        <h3>
          Basket comparison error
        </h3>

        <p style="margin-top:10px;">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/* =========================
   CALCULATE BASKET
========================= */

function calculateBasket(data){

  let maximumSavingsTotal = 0;

  let maximumSavingsItems = [];

  let missingProducts = [];


  /*
    OPTION 1:
    Cheapest available price
    for each selected product.
  */

  data.forEach(item => {

    if(
      item.prices.length === 0
    ){

      missingProducts.push(
        item.product
      );

      return;
    }


    const sorted =
      [...item.prices].sort(
        (a,b) =>
          Number(a.price) -
          Number(b.price)
      );


    const cheapest =
      sorted[0];


    const unitPrice =
      Number(cheapest.price);

    const total =
      unitPrice *
      item.quantity;


    maximumSavingsTotal +=
      total;


    const shop =
      findShop(
        cheapest.shop_id
      );


    maximumSavingsItems.push({

      product:item.product,

      quantity:item.quantity,

      unitPrice:unitPrice,

      total:total,

      shop:shop

    });

  });


  /*
    OPTION 2:
    Find the cheapest shop where
    the entire basket is available.
  */

  const shopTotals = {};


  allShops.forEach(shop => {

    const shopId =
      getShopId(shop);

    shopTotals[
      String(shopId)
    ] = {

      shop:shop,

      total:0,

      complete:true,

      items:[]

    };

  });


  data.forEach(item => {

    Object.keys(
      shopTotals
    ).forEach(shopId => {

      const matching =
        item.prices.find(
          row =>
            String(row.shop_id) ===
            String(shopId)
        );


      if(!matching){

        shopTotals[
          shopId
        ].complete = false;

        return;

      }


      const cost =
        Number(matching.price) *
        item.quantity;


      shopTotals[
        shopId
      ].total += cost;


      shopTotals[
        shopId
      ].items.push({

        product:item.product,

        quantity:item.quantity,

        price:Number(
          matching.price
        )

      });

    });

  });


  const completeShops =
    Object.values(
      shopTotals
    )
    .filter(
      option =>
        option.complete
    )
    .sort(
      (a,b) =>
        a.total - b.total
    );


  let html = `

    <div class="basket-total">

      <h2>
        🏆 Maximum Savings
      </h2>

      <p style="margin-top:10px;">
        Cheapest available option
        for every item.
      </p>

      <h2 style="margin-top:15px;">
        P${maximumSavingsTotal.toFixed(2)}
      </h2>

    </div>

  `;


  /*
    Show cheapest item-by-item
    selections.
  */

  html += `

    <div class="basket-card">

      <h2>
        🛍️ Cheapest Products
      </h2>

  `;


  maximumSavingsItems.forEach(
    item => {

      const shopName =
        item.shop
        ? getShopName(item.shop)
        : "Unknown shop";


      html += `

        <div class="price-row">

          <div>

            <strong>
              ${escapeHtml(
                getProductName(
                  item.product
                )
              )}
            </strong>

            <div style="
              margin-top:5px;
              color:#666;
              font-size:14px;
            ">

              ${escapeHtml(
                getProductBrand(
                  item.product
                )
              )}

              × ${item.quantity}

            </div>

            <div style="
              margin-top:5px;
              color:#15803d;
              font-size:14px;
            ">

              Buy at
              ${escapeHtml(shopName)}

            </div>

          </div>

          <strong>
            P${item.total.toFixed(2)}
          </strong>

        </div>

      `;

    }
  );


  if(
    missingProducts.length > 0
  ){

    html += `

      <p style="
        margin-top:15px;
        color:#b45309;
      ">

        ⚠️ Some products have no
        price available yet.

      </p>

    `;

  }


  html += `</div>`;


  /*
    One-shop option.
  */

  html += `

    <div class="basket-card">

      <h2>
        🏪 One-Shop Option
      </h2>

      <p style="margin-top:8px;">
        Cheapest total if you buy
        everything from one shop.
      </p>

  `;


  if(
    completeShops.length === 0
  ){

    html += `

      <div class="shop-option">

        No single shop currently has
        every item in your basket.

      </div>

    `;

  }else{

    const bestShop =
      completeShops[0];


    completeShops.forEach(
      (option,index) => {

        html += `

          <div class="
            shop-option
            ${index === 0
              ? "best-shop"
              : ""}
          ">

            ${
              index === 0
              ? `
                <div class="cheapest-label">
                  🏆 Cheapest one-shop basket
                </div>
              `
              : ""
            }

            <div style="
              display:flex;
              justify-content:space-between;
              margin-top:8px;
            ">

              <strong>
                ${escapeHtml(
                  getShopName(
                    option.shop
                  )
                )}
              </strong>

              <strong>
                P${option.total.toFixed(2)}
              </strong>

            </div>

            ${
              getShopLocation(
                option.shop
              )
              ? `
                <div style="
                  margin-top:6px;
                  color:#666;
                  font-size:14px;
                ">

                  📍 ${escapeHtml(
                    getShopLocation(
                      option.shop
                    )
                  )}

                </div>
              `
              : ""
            }

          </div>

        `;

      }
    );


    if(
      bestShop.total >
      maximumSavingsTotal
    ){

      const difference =
        bestShop.total -
        maximumSavingsTotal;


      html += `

        <p class="saving"
           style="margin-top:15px;">

          💰 You could save
          P${difference.toFixed(2)}
          by buying from different
          shops.

        </p>

      `;

    }

  }


  html += `</div>`;


  document.getElementById(
    "basketContent"
  ).innerHTML = html;

}
