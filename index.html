}

.food-orb:nth-child(1){

  top:130px;
}

.food-orb:nth-child(2){

  top:280px;
  width:180px;
  height:180px;

.food-orb:nth-child(3){

}

.food-orb:nth-child(4){

  height:140px;
  animation-delay:6s;
}

/* =====================================================

===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  const n = Number(value);

  if(!Number.isFinite(n))
    return "P0.00";

  return "P" + n.toFixed(2);

}


function getProductId(product){

  return (
    product.product_id ??
    product.Product_id ??
    product.id ??
    product.Id ??
    product.ID ??
    product["I'd"]
  );

}


function getProductName(product){

  return (
    product.name ??
    product.Name ??
    product.product_name ??
    product.Product_name ??
    product.product ??
    product.Product ??
    "Unnamed product"
  );

}


function getProductBrand(product){

function getProductSize(product){

/* =====================================================
   SUPABASE FETCH
===================================================== */

async function supabaseFetch(
  path,
  options={}
){

  const response =
    await fetch(
      `${SUPABASE_URL}/rest/v1/${path}`,
      {
        ...options,

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`,

          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text ||
      `Supabase error ${response.status}`
    );

  }


  const text =
    await response.text();

  return text
    ? JSON.parse(text)
    : [];

}


/* =====================================================
   LOCAL LIST
===================================================== */

function saveShoppingList(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(shoppingList)
    );

  }catch(error){

    console.error(
      "SAVE LIST ERROR:",
      error
    );

  }

}


function loadSavedShoppingList(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved){

      shoppingList = [];

      return;

    }


    const parsed =
      JSON.parse(saved);


    if(Array.isArray(parsed)){

      shoppingList =
        parsed
          .filter(
            item =>
              item &&
              item.product &&
              Number(item.quantity) > 0
          )
          .map(item => ({

            product:item.product,

            quantity:
              Math.max(
                1,
                Number(item.quantity)
              )

          }));

    }else{

      shoppingList = [];

    }

  }catch(error){

    console.error(
      "LOAD LIST ERROR:",
      error
    );

    shoppingList = [];

  }

}

/* =====================================================
   CLOUD LIST
===================================================== */

async function getCloudList(){

  const user =
    await getCurrentUser();

  if(!user)
    return null;


  const response =
    await supabaseFetch(
      `shopping_lists?select=*&user_id=eq.${encodeURIComponent(user.id)}&limit=1`
    );


  if(
    Array.isArray(response) &&
    response.length > 0
  ){

    return response[0];

  }


  return null;

}


async function saveCloudShoppingList(){

  const user =
    await getCurrentUser();

  if(!user)
    return false;


  try{

    const existing =
      await getCloudList();


    const payload = {

      user_id:user.id,

      items:shoppingList,

      updated_at:
        new Date().toISOString()

    };


    if(existing){

      await supabaseFetch(
        `shopping_lists?id=eq.${encodeURIComponent(existing.id)}`,
        {
          method:"PATCH",

          headers:{
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({
            items:shoppingList,
            updated_at:
              new Date().toISOString()
          })

        }
      );

    }else{

      await supabaseFetch(
        "shopping_lists",
        {
          method:"POST",

          headers:{
            "Prefer":"return=minimal"
          },

          body:JSON.stringify(payload)

        }
      );

    }


    return true;

  }catch(error){

    console.error(
      "CLOUD SAVE ERROR:",
      error
    );

    return false;

  }

}


async function syncCloudShoppingList(){

  const user =
    await getCurrentUser();

  if(!user)
    return;


  try{

    const cloud =
      await getCloudList();


    if(
      cloud &&
      Array.isArray(cloud.items)
    ){

      const cloudItems =
        cloud.items.filter(
          item =>
            item &&
            item.product &&
            Number(item.quantity) > 0
        );


      if(cloudItems.length > 0){

        const merged = [];


        for(
          const item
          of [...cloudItems,...shoppingList]
        ){

          const id =
            getProductId(
              item.product
            );


          const existing =
            merged.find(
              x =>
                String(
                  getProductId(
                    x.product
                  )
                ) ===
                String(id)
            );


          if(existing){

            existing.quantity +=
              Number(item.quantity);

          }else{

            merged.push({

              product:item.product,

              quantity:
                Math.max(
                  1,
                  Number(item.quantity)
                )

            });

          }

        }


        shoppingList =
          merged;

      }else if(
        shoppingList.length > 0
      ){

        await saveCloudShoppingList();

      }

    }else if(
      shoppingList.length > 0
    ){

      await saveCloudShoppingList();

    }


    saveShoppingList();

    updateListCount();

  }catch(error){

    console.error(
      "CLOUD SYNC ERROR:",
      error
    );

  }

}


/* =====================================================
   SHOPPING LIST
===================================================== */

async function addToShoppingList(product){

  const id =
    getProductId(product);


  const existing =
    shoppingList.find(
      item =>
        String(
          getProductId(
            item.product
          )
        ) === String(id)
    );


  if(existing){

    existing.quantity += 1;

  }else{

    shoppingList.push({

      product,

      quantity:1

    });

  }


  saveShoppingList();

  updateListCount();

  await saveCloudShoppingList();


  alert(
    `${getProductName(product)} added to your shopping list.`
  );

}


function updateListCount(){

  const count =
    shoppingList.reduce(
      (sum,item) =>
        sum + Number(item.quantity || 0),
      0
    );


  const badge =
    document.getElementById(
      "listCount"
    );


  if(badge)
    badge.textContent = count;

}

===================================================== */

function selectCategory(category){

  currentCategory =
    category;

  updateFoodBackground();

  renderCategories();

  filterProducts();

}


function filterProducts(){

  const search =
    (
      document.getElementById(
        "searchInput"
      )?.value || ""
    )
      .toLowerCase()
      .trim();


  let filtered =
    allProducts.filter(
      product => {

        const text = (

          getProductName(product)
          + " " +
          getProductBrand(product)
          + " " +
          getProductSize(product)
          + " " +
          getProductCategory(product)

        ).toLowerCase();


        const matchesSearch =
          !search ||
          text.includes(search);


        let matchesCategory = true;


        if(currentCategory === "Groceries"){

          matchesCategory =
            isGroceryProduct(product);

        }else if(
          currentCategory !== "All"
        ){

          matchesCategory =
            getProductCategory(product)
              .toLowerCase()
              .trim()
              ===
              currentCategory.toLowerCase();

        }


        return (
          matchesSearch &&
          matchesCategory
        );

      }
    );


  displayProducts(
    filtered
  );

}

async function showComparison(productId){

  document.getElementById(
    "app"
  ).innerHTML = `

    <button
      class="back-btn"
      onclick="showHome()">
      ← Back
    </button>

    <div class="message">

      <h2>
        💰 Price Comparison
      </h2>

      <p style="margin-top:10px;">
        Loading prices...
      </p>

    </div>

  `;


  try{

    const prices =
      await supabaseFetch(
        `product_prices?select=product_id,shop_id,price&product_id=eq.${encodeURIComponent(productId)}`
      );


    const validPrices =
      Array.isArray(prices)
      ? prices
          .filter(
            row =>
              Number.isFinite(
                Number(row.price)
              )
          )
          .sort(
            (a,b) =>
              Number(a.price) -
              Number(b.price)
          )
      : [];


    if(!validPrices.length){

      document.getElementById(
        "app"
      ).innerHTML = `

        <button
          class="back-btn"
          onclick="showHome()">
          ← Back
        </button>

        <div class="message">

          <h2>
            No prices available
          </h2>

          <p style="margin-top:10px;">
            There are currently no prices
            for this product.
          </p>

        </div>

      `;

      return;

    }


    const product =
      allProducts.find(
        p =>
          String(
            getProductId(p)
          ) ===
          String(productId)
      );


    let html = `

      <button
        class="back-btn"
        onclick='showProduct(${JSON.stringify(product).replace(/'/g,"&#39;")})'>
        ← Back
      </button>

      <h2>
        💰 Price Comparison
      </h2>

      <p style="margin:7px 0 15px;color:#777;">
        ${escapeHtml(
          product
          ? getProductName(product)
          : "Product"
        )}
        — prices across shops
      </p>

    `;


    validPrices.forEach(
      (row,index) => {

        const shop =
          allShops.find(
            s =>
              String(
                getShopId(s)
              ) ===
              String(row.shop_id)
          );


        const shopName =
          shop
          ? getShopName(shop)
          : "Unknown shop";


        const location =
          shop
          ? getShopLocation(shop)
          : "";


        html += `

          <div class="
            comparison-row
            ${index === 0 ? "cheapest" : ""}
          ">

            <div>

              <strong>
                ${index === 0 ? "🏆 " : ""}

              </strong>

              ${
                location
                ? `
                  <div
                    style="color:#777;margin-top:4px;">
                    📍 ${escapeHtml(location)}
                  </div>
                `
                : ""
              }

            </div>


            <strong
              style="font-size:20px;">
              ${money(row.price)}
            </strong>

          </div>

        `;

      }
    );


    document.getElementById(
      "app"
    ).innerHTML = html;


  }catch(error){

    console.error(
      "PRICE COMPARISON ERROR:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <button
        class="back-btn"
        onclick="showHome()">
        ← Back
      </button>

      <div class="message error">

        <h3>
          Price comparison error
        </h3>

        <p style="margin-top:10px;">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}

async function getBestDeals(){

  const deals = [];


  for(
    const product
    of allProducts
  ){

    const id =
      getProductId(product);


    try{

      const prices =
        await supabaseFetch(
          `product_prices?select=product_id,shop_id,price&product_id=eq.${encodeURIComponent(id)}`
        );


      const valid =
        prices
          .filter(
            p =>
              Number.isFinite(
                Number(p.price)
              )
          )
          .sort(
            (a,b) =>
              Number(a.price) -
              Number(b.price)
          );


      if(valid.length >= 2){

        const cheapest =
          Number(valid[0].price);

        const highest =
          Number(
            valid[valid.length - 1].price
          );


        deals.push({

          product,

          cheapest,

          highest,

          saving:
            highest - cheapest,

          shopId:
            valid[0].shop_id

        });

      }

    }catch(error){

      console.error(
        "DEAL ERROR:",
        error
      );

    }

  }


  return deals
    .sort(
      (a,b) =>
        b.saving -
        a.saving
    );

}

/* =====================================================
   NEARBY SHOPS
===================================================== */

function extractCoordinates(shop){

  const latitude =
    shop.latitude ??
    shop.Latitude ??
    shop.lat ??
    shop.Lat;


  const longitude =
    shop.longitude ??
    shop.Longitude ??
    shop.lng ??
    shop.Lng ??
    shop.lon ??
    shop.Lon;


  if(
    latitude === undefined ||
    longitude === undefined
  )
    return null;


  const lat =
    Number(latitude);

  const lng =
    Number(longitude);


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  )
    return null;


  return {
    lat,
    lng
  };

}


function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
    (lat2-lat1)
    * Math.PI / 180;

  const dLon =
    (lon2-lon1)
    * Math.PI / 180;


  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) ** 2;


  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


function showNearbyShops(){

  document.getElementById(
    "app"
  ).innerHTML = `

    <button
      class="back-btn"
      onclick="showHome()">
      ← Back
    </button>

    <h2>
      📍 Nearby Shops
    </h2>

    <p style="margin:8px 0 15px;color:#777;">
      Finding shops near you...
    </p>

    <div
      id="nearbyResults"
      class="shop-grid">

      <div class="message">
        Requesting your location...
      </div>

    </div>

  `;


  if(!navigator.geolocation){

    document.getElementById(
      "nearbyResults"
    ).innerHTML =
      `<div class="message">
        Geolocation is not supported
        by this browser.
      </div>`;

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const userLat =
        position.coords.latitude;

      const userLng =
        position.coords.longitude;


      const shops =
        allShops
          .map(shop => {

            const coords =
              extractCoordinates(shop);


            if(!coords)
              return null;


            return {

              shop,

              distance:
                distanceKm(
                  userLat,
                  userLng,
                  coords.lat,
                  coords.lng
                ),

              coords

            };

          })
          .filter(Boolean)
          .sort(
            (a,b) =>
              a.distance -
              b.distance
          );


      const container =
        document.getElementById(
          "nearbyResults"
        );


      if(!shops.length){

        container.innerHTML = `

          <div class="message">

            <h3>
              Shop locations unavailable
            </h3>

            <p style="margin-top:10px;">
              Your shops need latitude and
              longitude values before
              Nearby Shops can calculate
              distances.
            </p>

          </div>

        `;

        return;

      }


      container.innerHTML =
        shops
          .slice(0,12)
          .map(item => `

            <div class="shop-card">

              <h3>
                ${escapeHtml(
                  getShopName(
                    item.shop
                  )
                )}
              </h3>

              <p style="margin:7px 0;color:#777;">
                ${
                  getShopLocation(
                    item.shop
                  )
                  ? "📍 " +
                    escapeHtml(
                      getShopLocation(
                        item.shop
                      )
                    )
                  : ""
                }
              </p>

              <strong>
                ${item.distance.toFixed(1)}
                km away
              </strong>

              <br>

              <button
                onclick="window.open(
                  'https://www.google.com/maps/dir/?api=1&destination=${item.coords.lat},${item.coords.lng}',
                  '_blank'
                )">

                🗺️ Directions

              </button>

            </div>

          `)
          .join("");

    },

    error => {

      document.getElementById(
        "nearbyResults"
      ).innerHTML = `

        <div class="message">

          <h3>
            Location unavailable
          </h3>

          <p style="margin-top:10px;">
            Please allow location access
            and try again.
          </p>

        </div>

      `;

    }

  );

}

          ×
        </button>

      </div>

    </div>

  `;

}


async function changeQuantity(
  index,
  amount
){

  if(!shoppingList[index])
    return;


  shoppingList[index].quantity +=
    amount;


  if(
    shoppingList[index].quantity <= 0
  ){

    shoppingList.splice(
      index,
      1
    );

  }


  saveShoppingList();

  updateListCount();

  await saveCloudShoppingList();

  showShoppingList();

}


async function removeFromList(index){

  shoppingList.splice(
    index,
    1
  );


  saveShoppingList();

  updateListCount();

  await saveCloudShoppingList();

  showShoppingList();

}


async function clearShoppingList(){

  if(!confirm(
    "Clear your entire shopping list?"
  ))
    return;


  shoppingList = [];

  saveShoppingList();

  updateListCount();

  await saveCloudShoppingList();

  showShoppingList();

}


/* =====================================================
   CHEAPEST BASKET
===================================================== */

async function findCheapestBasket(){

  if(!shoppingList.length)
    return;


  document.getElementById(
    "app"
  ).innerHTML = `

    <button
      class="back-btn"
      onclick="showShoppingList()">
      ← Back
    </button>

    <div class="message">

      <h2>
        🏆 Finding Cheapest Basket
      </h2>

      <p style="margin-top:10px;">
        Checking prices across shops...
      </p>

    </div>

  `;


  const results = [];


  for(
    const item
    of shoppingList
  ){

    const product =
      item.product;


    const productId =
      getProductId(product);


    try{

      const prices =
        await supabaseFetch(
          `product_prices?select=product_id,shop_id,price&product_id=eq.${encodeURIComponent(productId)}`
        );


      const valid =
        prices
          .filter(
            p =>
              Number.isFinite(
                Number(p.price)
              )
          )
          .map(p => ({

            ...p,

            price:
              Number(p.price)

          }))
          .sort(
            (a,b) =>
              a.price -
              b.price
          );


      results.push({

        product,

        quantity:
          Number(item.quantity),

        prices:valid

      });

    }catch(error){

      console.error(
        "BASKET PRICE ERROR:",
        error
      );

    }

  }


  renderBasket(
    results
  );

}


function renderBasket(results){

  let maximumSavingsTotal = 0;

  const cheapestProducts = [];


  results.forEach(
    result => {

      if(!result.prices.length)
        return;


      const cheapest =
        result.prices[0];


      const cost =
        cheapest.price *
        result.quantity;


      maximumSavingsTotal +=
        cost;


      const shop =
        allShops.find(
          s =>
            String(
              getShopId(s)
            ) ===
            String(
              cheapest.shop_id
            )
        );


      cheapestProducts.push({

        product:
          result.product,

        quantity:
          result.quantity,

        price:
          cheapest.price,

        total:
          cost,

        shop

      });

    }
  );


  const shopTotals = {};


  results.forEach(
    result => {

      result.prices.forEach(
        priceRow => {

          const shopId =
            String(
              priceRow.shop_id
            );


          if(!shopTotals[shopId]){

            shopTotals[shopId] = {

              shopId,

              total:0,

              count:0

            };

          }


          shopTotals[shopId].total +=
            priceRow.price *
            result.quantity;


          shopTotals[shopId].count += 1;

        }
      );

    }
  );


  const completeShopOptions =
    Object.values(
      shopTotals
    )
    .filter(
      shop =>
        shop.count === results.length
    )
    .sort(
      (a,b) =>
        a.total -
        b.total
    );


  const oneShopTotal =
    completeShopOptions.length
    ? completeShopOptions[0].total
    : null;


  const multipleShopTotal =
    maximumSavingsTotal;


  const savings =
    oneShopTotal !== null
      ? oneShopTotal -
        multipleShopTotal
      : 0;


  document.getElementById(
    "app"
  ).innerHTML = `

    <button
      class="back-btn"
      onclick="showShoppingList()">
      ← Back
    </button>


    <h2>
      🏆 Cheapest Basket
    </h2>


    <div class="card"
         style="margin-top:15px;">

      <h3>
        Maximum Savings
      </h3>

      <div class="basket-total">
        ${money(
          multipleShopTotal
        )}
      </div>

      <p style="color:#777;">
        Buying each product from
        its cheapest shop.
      </p>

    </div>


    <section class="section">

      <h3 style="margin-bottom:12px;">
        Cheapest Products
      </h3>

      ${
        cheapestProducts.length
        ? cheapestProducts
            .map(item => `

              <div class="comparison-row">

                <div>

                  <strong>
                    ${escapeHtml(
                      getProductName(
                        item.product
                      )
                    )}
                  </strong>

                  <div style="color:#777;margin-top:5px;">

                    ${item.quantity}
                    ×
                    ${escapeHtml(
                      item.shop
                      ? getShopName(
                          item.shop
                        )
                      : "Unknown shop"
                    )}

                  </div>

                </div>

                <strong>
                  ${money(
                    item.total
                  )}
                </strong>

              </div>

            `)
            .join("")
        : `
          <div class="message">
            Some products have no prices.
          </div>
        `
      }

    </section>


    <section class="section">

      <h3 style="margin-bottom:12px;">
        🏪 One-Shop Option
      </h3>

      ${
        completeShopOptions.length
        ? completeShopOptions
            .map((option,index) => {

              const shop =
                allShops.find(
                  s =>
                    String(
                      getShopId(s)
                    ) ===
                    String(
                      option.shopId
                    )
                );


              return `

                <div
                  class="
                    comparison-row
                    ${
                      index === 0
                      ? "cheapest"
                      : ""
                    }
                  ">

                  <div>

                    <strong>
                      ${
                        index === 0
                        ? "🏆 "
                        : ""
                      }

                      ${escapeHtml(
                        shop
                        ? getShopName(shop)
                        : "Unknown shop"
                      )}

                    </strong>

                  </div>

                  <strong>
                    ${money(
                      option.total
                    )}
                  </strong>

                </div>

              `;

            })
            .join("")
        : `
          <div class="message">

            <p>
              No single shop currently
              has every item in your list.
            </p>

          </div>
        `
      }

    </section>


    ${
      savings > 0.009
      ? `

        <div class="saved-note"
             style="margin-top:20px;">

          💰 You could save approximately
          <strong>
            ${money(savings)}
          </strong>
          by buying from multiple shops.

        </div>

      `
      : ""
    }

  `;

}

        session
      ){

        await syncCloudShoppingList();

        updateListCount();

      if(

        updateListCount();

    }
  );
