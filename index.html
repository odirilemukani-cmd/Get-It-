<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get-It 🇧🇼 | Find. Compare. Get.</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
color:#222;
}

header{
background:#003f7d;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:24px;
font-weight:bold;
}

.location{
font-size:14px;
}

.hero{
background:linear-gradient(135deg,#003f7d,#0077b6);
color:white;
padding:40px 20px;
text-align:center;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.hero p{
margin-bottom:20px;
}

.search-box{
max-width:600px;
margin:auto;
display:flex;
background:white;
border-radius:8px;
overflow:hidden;
}

.search-box input{
flex:1;
padding:14px;
border:none;
outline:none;
font-size:16px;
}

.search-box button{
padding:14px 20px;
border:none;
background:#f4c430;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.section-title{
margin-bottom:15px;
font-size:24px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:15px;
margin-bottom:20px;
}

.category-btn{
flex-shrink:0;
padding:12px 18px;
border:none;
border-radius:25px;
background:white;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
font-weight:bold;
}

.category-btn.active{
background:#003f7d;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
}

.product-card{
background:white;
border-radius:10px;
padding:18px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.product-icon{
font-size:45px;
text-align:center;
margin-bottom:12px;
}

.product-card h3{
margin-bottom:8px;
}

.product-card p{
color:#666;
margin-bottom:6px;
}

.product-card button{
width:100%;
margin-top:12px;
padding:11px;
border:none;
border-radius:6px;
background:#003f7d;
color:white;
cursor:pointer;
font-weight:bold;
}

.message{
background:white;
padding:25px;
text-align:center;
border-radius:10px;
color:#666;
grid-column:1/-1;
}

.hidden{
display:none!important;
}

.details-box{
background:white;
border-radius:10px;
padding:25px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.details-box h2{
margin-bottom:15px;
color:#003f7d;
}

.details-row{
padding:10px 0;
border-bottom:1px solid #eee;
}

.back-btn{
margin-bottom:20px;
padding:10px 16px;
border:none;
border-radius:6px;
background:#555;
color:white;
cursor:pointer;
}

.compare-btn{
background:#f4c430!important;
color:#222!important;
}

.price-list{
margin-top:20px;
}

.price-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
padding:15px;
margin-bottom:10px;
background:#f8f9fa;
border-radius:8px;
border:1px solid #ddd;
}

.price-item.cheapest{
border:2px solid #198754;
background:#eaf8ef;
}

.shop-name{
font-weight:bold;
font-size:17px;
}

.shop-price{
font-weight:bold;
font-size:18px;
white-space:nowrap;
}

.cheapest-label{
display:block;
color:#198754;
font-size:13px;
margin-top:4px;
}

footer{
margin-top:40px;
background:#003f7d;
color:white;
text-align:center;
padding:20px;
}

@media(max-width:600px){

.hero h1{
font-size:26px;
}

.logo{
font-size:20px;
}

.location{
font-size:12px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.product-card{
padding:12px;
}

.product-icon{
font-size:35px;
}

.product-card h3{
font-size:16px;
}

.product-card p{
font-size:13px;
}

.price-item{
padding:12px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
Get-It 🇧🇼
</div>

<div class="location">
📍 Botswana
</div>

</header>


<section class="hero">

<h1>
Find. Compare. Get.
</h1>

<p>
Find products and compare prices across Botswana.
</p>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search for a product..."
>

<button onclick="searchProducts()">
Search
</button>

</div>

</section>


<div class="container">


<section id="productsScreen">

<h2
class="section-title"
id="productsTitle"
>
Popular Products
</h2>


<div class="categories">

<button
class="category-btn active"
onclick="showCategory('',this)"
>
🛒 All
</button>

<button
class="category-btn"
onclick="showCategory('Groceries',this)"
>
🛒 Groceries
</button>

<button
class="category-btn"
onclick="showCategory('Electronics',this)"
>
📱 Electronics
</button>

<button
class="category-btn"
onclick="showCategory('Clothing',this)"
>
👕 Clothing
</button>

<button
class="category-btn"
onclick="showCategory('Beauty',this)"
>
💄 Beauty
</button>

<button
class="category-btn"
onclick="showCategory('Household',this)"
>
🏠 Household
</button>

</div>


<div
id="productsContainer"
class="products"
>

<div class="message">
Loading products...
</div>

</div>

</section>



<section
id="detailsScreen"
class="hidden"
>

<button
class="back-btn"
onclick="backToProducts()"
>
← Back to Products
</button>


<div
id="productDetails"
class="details-box"
>
</div>

</section>



<section
id="compareScreen"
class="hidden"
>

<button
class="back-btn"
onclick="backToDetails()"
>
← Back to Product
</button>


<div class="details-box">

<h2 id="compareTitle">
💰 Price Comparison
</h2>

<p id="compareSubtitle">
Comparing prices...
</p>


<div
id="priceContainer"
class="price-list"
>

<div class="message">
Loading prices...
</div>

</div>

</div>

</section>

</div>


<footer>

<p>
© 2026 Get-It 🇧🇼
</p>

<p>
Find. Compare. Get.
</p>

</footer>


<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://snjrlhkmixiamgqhfhug.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3jRUAQ88ntmpnA42QwTuew_TJ7NYgFw";


/* =========================================
VARIABLES
========================================= */

let allProducts = [];

let allShops = [];

let selectedCategory = "";

let selectedProduct = null;


/* =========================================
NORMALIZE
========================================= */

function normalize(value){

return String(value ?? "")
.trim()
.toLowerCase()
.replace(/\s+/g," ");

}


/* =========================================
ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================
GET PRODUCT ID
========================================= */

function getProductId(product){

return (
product.product_id ??
product.Product_id ??
product.id ??
product.Id ??
""
);

}


/* =========================================
GET SHOP ID
========================================= */

function getShopId(shop){

return (
shop.shop_id ??
shop.Shop_id ??
shop.id ??
shop.Id ??
""
);

}


/* =========================================
GET SHOP NAME
========================================= */

function getShopName(shop){

return (
shop.Name ??
shop.name ??
shop.Shop_name ??
shop.shop_name ??
"Unknown shop"
);

}


/* =========================================
GET SHOP LOCATION
========================================= */

function getShopLocation(shop){

return (
shop.Location ??
shop.location ??
""
);

}


/* =========================================
GET SHOP ADDRESS
========================================= */

function getShopAddress(shop){

return (
shop.Address ??
shop.address ??
""
);

}


/* =========================================
LOAD PRODUCTS
========================================= */

async function loadProducts(){

const container =
document.getElementById("productsContainer");

container.innerHTML =
'<div class="message">Loading products...</div>';

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/products?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);


if(!response.ok){

throw new Error(
"Products error: "+response.status
);

}


const data =
await response.json();

allProducts =
Array.isArray(data) ? data : [];

renderProducts();

}

catch(error){

console.error(
"LOAD PRODUCTS ERROR:",
error
);

container.innerHTML =
'<div class="message">' +
'Unable to load products. Please refresh the page.' +
'</div>';

}

}


/* =========================================
LOAD SHOPS
========================================= */

async function loadShops(){

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/shops?select=*",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);


if(!response.ok){

throw new Error(
"Shops error: "+response.status
);

}


const data =
await response.json();

allShops =
Array.isArray(data) ? data : [];


console.log(
"SHOPS:",
allShops
);

}

catch(error){

console.error(
"LOAD SHOPS ERROR:",
error
);

allShops = [];

}

}


/* =========================================
RENDER PRODUCTS
========================================= */

function renderProducts(){

const container =
document.getElementById("productsContainer");

const title =
document.getElementById("productsTitle");

const search =
normalize(
document.getElementById("searchInput").value
);


const filtered =
allProducts.filter(function(product){

const category =
normalize(
product.Category ??
product.category
);

const name =
normalize(
product.Name ??
product.name
);

const brand =
normalize(
product.Brand ??
product.brand
);


const categoryMatch =
!selectedCategory ||
category === normalize(selectedCategory);


const searchMatch =
!search ||
name.includes(search) ||
brand.includes(search);


return categoryMatch && searchMatch;

});


if(selectedCategory){

title.textContent =
selectedCategory;

}

else if(search){

title.textContent =
"Search Results";

}

else{

title.textContent =
"Popular Products";

}


if(filtered.length===0){

container.innerHTML =
'<div class="message">No products found.</div>';

return;

}


container.innerHTML =
filtered.map(function(product){

const name =
product.Name ??
product.name ??
"Unnamed Product";

const brand =
product.Brand ??
product.brand ??
"No brand";

const category =
product.Category ??
product.category ??
"Other";

const size =
product.Size ??
product.size ??
"";

const productId =
getProductId(product);


return `

<div class="product-card">

<div class="product-icon">
🛍️
</div>

<h3>
${escapeHtml(name)}
</h3>

<p>
<strong>Brand:</strong>
${escapeHtml(brand)}
</p>

<p>
<strong>Category:</strong>
${escapeHtml(category)}
</p>

${
size
?
`
<p>
<strong>Size:</strong>
${escapeHtml(size)}
</p>
`
:""
}

<button
onclick='openProduct(${JSON.stringify(String(productId))})'
>
View Product
</button>

</div>

`;

}).join("");

}


/* =========================================
CATEGORY
========================================= */

function showCategory(category,button){

selectedCategory =
category;


document
.querySelectorAll(".category-btn")
.forEach(function(btn){

btn.classList.remove("active");

});


button.classList.add("active");

renderProducts();

}


/* =========================================
SEARCH
========================================= */

function searchProducts(){

renderProducts();

}


document
.getElementById("searchInput")
.addEventListener(
"input",
renderProducts
);


/* =========================================
OPEN PRODUCT
========================================= */

function openProduct(productId){

const product =
allProducts.find(function(item){

return String(
getProductId(item)
).trim() ===
String(productId).trim();

});


if(!product){

alert("Product not found.");

return;

}


selectedProduct =
product;


document
.getElementById("productsScreen")
.classList.add("hidden");

document
.getElementById("compareScreen")
.classList.add("hidden");

document
.getElementById("detailsScreen")
.classList.remove("hidden");


const details =
document.getElementById("productDetails");


const name =
product.Name ??
product.name ??
"Unnamed Product";

const brand =
product.Brand ??
product.brand ??
"Not listed";

const category =
product.Category ??
product.category ??
"Not listed";

const size =
product.Size ??
product.size ??
"Not listed";

const allergens =
product.Allergens ??
product.allergens ??
"Not listed";

const ingredients =
product.Ingredients ??
product.ingredients ??
"Not listed";


details.innerHTML = `

<div class="product-icon">
🛍️
</div>

<h2>
${escapeHtml(name)}
</h2>

<div class="details-row">
<strong>Brand:</strong>
${escapeHtml(brand)}
</div>

<div class="details-row">
<strong>Category:</strong>
${escapeHtml(category)}
</div>

<div class="details-row">
<strong>Size:</strong>
${escapeHtml(size)}
</div>

<div class="details-row">
<strong>Allergens:</strong>
${escapeHtml(allergens)}
</div>

<div class="details-row">
<strong>Ingredients:</strong>
${escapeHtml(ingredients)}
</div>

<button
class="compare-btn"
onclick="comparePrices()"
style="
width:100%;
margin-top:20px;
padding:13px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
"
>
💰 Compare Prices
</button>

`;

}


/* =========================================
COMPARE PRICES
========================================= */

async function comparePrices(){

if(!selectedProduct){

return;

}


document
.getElementById("detailsScreen")
.classList.add("hidden");

document
.getElementById("compareScreen")
.classList.remove("hidden");


const compareSubtitle =
document.getElementById("compareSubtitle");

const priceContainer =
document.getElementById("priceContainer");


const productName =
selectedProduct.Name ??
selectedProduct.name ??
"Product";


const productId =
getProductId(selectedProduct);


compareSubtitle.textContent =
productName +
" — prices across shops";


priceContainer.innerHTML =
'<div class="message">Loading prices...</div>';


try{

/* =====================================
MAKE SURE SHOPS ARE LOADED
===================================== */

if(!allShops.length){

await loadShops();

}


/* =====================================
LOAD PRODUCT PRICES
IMPORTANT:
YOUR COLUMN IS prices
===================================== */

const priceUrl =
SUPABASE_URL +
"/rest/v1/product_prices" +
"?select=*" +
"&product_id=eq." +
encodeURIComponent(String(productId));


const priceResponse =
await fetch(
priceUrl,
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);


if(!priceResponse.ok){

const errorText =
await priceResponse.text();

console.error(
"PRICE DATABASE ERROR:",
errorText
);

throw new Error(
"Price database error: "+
priceResponse.status
);

}


const prices =
await priceResponse.json();


console.log(
"PRODUCT PRICES:",
prices
);


if(!Array.isArray(prices) ||
prices.length===0){

priceContainer.innerHTML =
'<div class="message">' +
'No prices available for this product yet.' +
'</div>';

return;

}


/* =====================================
MATCH PRICES WITH SHOPS
===================================== */

const comparison =
prices

.filter(function(item){

return (
item.available === true ||
item.available === "true" ||
item.available === 1 ||
item.available === "1" ||
item.available === null ||
item.available === undefined
);

})

.map(function(item){

/* PRICE SHOP ID */

const priceShopId =
normalize(
item.shop_id ??
item.Shop_id ??
item.shopId ??
""
);


/* FIND SHOP */

const matchingShop =
allShops.find(function(shop){

const shopId =
normalize(
getShopId(shop)
);

return (
shopId === priceShopId
);

});


/* =====================================
IMPORTANT FIX:
USE prices, NOT price
===================================== */

const rawPrice =
item.prices ??
item.Price ??
item.price ??
"";


const priceValue =
Number(
String(rawPrice)
.replace(/[^0-9.-]/g,"")
);


return{

shopName:
matchingShop
? getShopName(matchingShop)
: "Unknown shop",

location:
matchingShop
? getShopLocation(matchingShop)
: "",

address:
matchingShop
? getShopAddress(matchingShop)
: "",

price:
priceValue,

shopId:
priceShopId

};

})

.filter(function(item){

return (
Number.isFinite(item.price) &&
item.price >= 0
);

});


/* =====================================
NO VALID PRICES
===================================== */

if(comparison.length===0){

priceContainer.innerHTML =
'<div class="message">' +
'This product is currently unavailable.' +
'</div>';

return;

}


/* =====================================
CHEAPEST PRICE
===================================== */

comparison.sort(function(a,b){

return a.price-b.price;

});


const cheapest =
comparison[0].price;


/* =====================================
DISPLAY
===================================== */

priceContainer.innerHTML =
comparison.map(function(item){

const isCheapest =
item.price === cheapest;


return `

<div class="
price-item
${isCheapest ? "cheapest" : ""}
">

<div>

<div class="shop-name">
🏪 ${escapeHtml(item.shopName)}
</div>

${
item.location
?
`
<div style="
font-size:13px;
color:#666;
margin-top:4px;
">
📍 ${escapeHtml(item.location)}
</div>
`
:""
}

${
item.address
?
`
<div style="
font-size:12px;
color:#777;
margin-top:3px;
">
${escapeHtml(item.address)}
</div>
`
:""
}

${
isCheapest
?
`
<span class="cheapest-label">
🏆 Cheapest price
</span>
`
:""
}

</div>

<div class="shop-price">
P${item.price.toFixed(2)}
</div>

</div>

`;

}).join("");

}

catch(error){

console.error(
"COMPARISON ERROR:",
error
);

priceContainer.innerHTML =
'<div class="message">' +
'Unable to load price comparison. Please try again.' +
'</div>';

}

}


/* =========================================
BACK TO PRODUCTS
========================================= */

function backToProducts(){

document
.getElementById("detailsScreen")
.classList.add("hidden");

document
.getElementById("compareScreen")
.classList.add("hidden");

document
.getElementById("productsScreen")
.classList.remove("hidden");

}


/* =========================================
BACK TO DETAILS
========================================= */

function backToDetails(){

document
.getElementById("compareScreen")
.classList.add("hidden");

document
.getElementById("detailsScreen")
.classList.remove("hidden");

}


/* =========================================
START APPLICATION
========================================= */

async function startApp(){

await Promise.all([
loadProducts(),
loadShops()
]);

}

startApp();

</script>

</body>
</html>
