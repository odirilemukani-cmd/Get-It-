.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function money(value){

return "P"+n.toFixed(2);

}

/* =====================================================
SUPABASE FETCH
===================================================== */

async function supabaseFetch(path,options={}){

const response=
await fetch(
`${SUPABASE_URL}/rest/v1/${path}`,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":`Bearer ${SUPABASE_KEY}`,
"Content-Type":"application/json",
...(options.headers||{})
}
}
);

if(!response.ok){

const text=await response.text();

throw new Error(
text||`Supabase error ${response.status}`
);

}

const text=await response.text();

return text?JSON.parse(text):[];

}

JSON.stringify(shoppingList)

function loadSavedShoppingList(){

try{

const saved=
localStorage.getItem(STORAGE_KEY);

if(!saved){
shoppingList=[];
return;
}

const parsed=JSON.parse(saved);

if(Array.isArray(parsed)){

shoppingList=
parsed
.filter(
item=>
item &&
item.product &&
Number(item.quantity)>0
)
.map(item=>({
product:item.product,
quantity:Math.max(
1,
Number(item.quantity)
)
}));

}else{

shoppingList=[];

}

}catch(error){

console.error(error);
shoppingList=[];

}

}

shoppingList.reduce(
(sum,item)=>
sum+Number(item.quantity||0),
0
);

document.getElementById("listCount");

if(badge)

}

/* =====================================================
CLOUD LIST

async function saveCloudShoppingList(){

const user=
await getCurrentUser();

if(!user)
return;

try{

const existing=
await supabaseFetch(
`shopping_lists?select=*&user_id=eq.${encodeURIComponent(user.id)}&limit=1`
);

const payload={
user_id:user.id,
items:shoppingList,
updated_at:new Date().toISOString()
};

if(
Array.isArray(existing)&&
existing.length
){

await supabaseFetch(
`shopping_lists?id=eq.${encodeURIComponent(existing[0].id)}`,
{
method:"PATCH",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify({
items:shoppingList,
updated_at:new Date().toISOString()
})
}
);

}else{

await supabaseFetch(
"shopping_lists",
{
method:"POST",
headers:{
"Prefer":"return=minimal"
},
body:JSON.stringify(payload)
}
);

}

}catch(error){

console.error(
"CLOUD SAVE ERROR:",
error
);

}

}

async function syncCloudShoppingList(){

const user=
await getCurrentUser();

if(!user)
return;

try{

const cloud=
await supabaseFetch(
`shopping_lists?select=*&user_id=eq.${encodeURIComponent(user.id)}&limit=1`
);

if(
Array.isArray(cloud)&&
cloud.length&&
Array.isArray(cloud[0].items)
){

if(cloud[0].items.length){

shoppingList=cloud[0].items
.filter(
item=>
item &&
item.product &&
Number(item.quantity)>0
)
.map(item=>({
product:item.product,
quantity:Number(item.quantity)
}));

saveShoppingList();

}

}else if(shoppingList.length){

await saveCloudShoppingList();

}

updateListCount();

}catch(error){

console.error(
"CLOUD SYNC ERROR:",
error
);

}

}

);

);

return deals.sort(

);

}

function extractCoordinates(shop){

const latitude=
shop.latitude ??
shop.Latitude ??
shop.lat ??
shop.Lat;

const longitude=
shop.longitude ??
shop.Longitude ??
shop.lng ??
shop.Lng ??
shop.lon ??
shop.Lon;

if(
latitude===undefined||
longitude===undefined
)
return null;

const lat=Number(latitude);
const lng=Number(longitude);

if(
!Number.isFinite(lat)||
!Number.isFinite(lng)
)
return null;

return{lat,lng};

}


function distanceKm(
lat1,
lon1,
lat2,
lon2
){

const R=6371;

const dLat=
(lat2-lat1)*Math.PI/180;

const dLon=
(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}

function renderBasket(results){

let maximumSavingsTotal=0;

const cheapestProducts=[];

results.forEach(result=>{

if(!result.prices.length)
return;

const cheapest=
result.prices[0];

const cost=
cheapest.price*
result.quantity;

maximumSavingsTotal+=cost;

const shop=
allShops.find(
s=>
String(
getShopId(s)
)===String(
cheapest.shop_id
)
);

cheapestProducts.push({
product:result.product,
quantity:result.quantity,
price:cheapest.price,
total:cost,
shop
});

});

const shopTotals={};

results.forEach(result=>{

result.prices.forEach(priceRow=>{

const shopId=
String(priceRow.shop_id);

if(!shopTotals[shopId]){

shopTotals[shopId]={
shopId,
total:0,
count:0
};

}

shopTotals[shopId].total+=
priceRow.price*
result.quantity;

shopTotals[shopId].count+=1;

});

});

const completeShopOptions=
Object.values(shopTotals)
.filter(
shop=>
shop.count===results.length
)
.sort(
(a,b)=>a.total-b.total
);

const oneShopTotal=
completeShopOptions.length
?completeShopOptions[0].total
:null;

const savings=
oneShopTotal!==null
?oneShopTotal-maximumSavingsTotal
:0;

document.getElementById("app").innerHTML=`

<button
class="back-btn"
id="basketBack2">
← Back
</button>

ACCOUNT
===================================================== */

async function showAccount(){

const app=
document.getElementById("app");

app.innerHTML=`

<div class="message">
Loading account...
</div>
`;

const user=
await getCurrentUser();

if(user){

app.innerHTML=`

<button
class="back-btn"
id="accountBack">
← Back
</button>

<div class="account-card">

<h2>👤 My Account</h2>

<p style="margin-top:12px;">
Signed in as:
</p>

<strong>
${escapeHtml(user.email)}
</strong>

<div class="status">

☁️ Your shopping list is automatically
saved to your account.

</div>

<div class="auth-buttons"
style="margin-top:15px;">

<button
class="primary-btn"
id="accountListButton">
🛒 My Shopping List
</button>

<button
class="danger-btn"
id="logoutButton">
Logout
</button>

</div>

</div>
`;

document
.getElementById("accountBack")
.addEventListener(
"click",
showHome
);

document
.getElementById("accountListButton")
.addEventListener(
"click",
showShoppingList
);

document
.getElementById("logoutButton")
.addEventListener(
"click",
signOut
);

return;
}

app.innerHTML=`

<button
class="back-btn"
id="loginBack">
← Back
</button>

<div class="auth-box">

<h2>👤 Get-It Account</h2>

<p style="color:#777;margin-bottom:10px;">
Sign in to save your shopping list across devices.
</p>

<input
id="authEmail"
class="auth-input"
type="email"
placeholder="Email address"
>

<input
id="authPassword"
class="auth-input"
type="password"
placeholder="Password"
>

<div class="auth-buttons">

<button
class="primary-btn"
id="loginButton">
Login
</button>

<button
class="secondary-btn"
id="signupButton">
Create Account
</button>

</div>

<div id="authMessage"></div>

${
shoppingList.length
?`
<div class="saved-note"
style="margin-top:15px;">

🛒 You currently have
<strong>
${shoppingList.reduce(
(sum,item)=>
sum+Number(item.quantity||0),
0
)}
</strong>
item(s) in your shopping list.

<br><br>

After signing in, your list can be synced
to your account.

</div>
`
:""
}

</div>
`;

document
.getElementById("loginBack")
.addEventListener(
"click",
showHome
);

document
.getElementById("loginButton")
.addEventListener(
"click",
signIn
);

document
.getElementById("signupButton")
.addEventListener(
"click",
signUp
);


/* Allow Enter key to login */

document
.getElementById("authPassword")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){
signIn();
}

}
);

}


/* =====================================================
AUTH LISTENER
===================================================== */

supabaseAuth.auth.onAuthStateChange(
(event,session)=>{

console.log(
"AUTH EVENT:",
event
);

if(
event==="SIGNED_IN"&&
session
){

setTimeout(
async()=>{
await syncCloudShoppingList();
updateListCount();
},
0
);

}

if(event==="SIGNED_OUT"){

updateListCount();

}

}
);


/* =====================================================
START
===================================================== */

async function startApp(){

loadSavedShoppingList();
updateListCount();

document.getElementById("app").innerHTML=`

<div class="message">

<h2>
Get-It 🇧🇼
</h2>

<p style="margin-top:10px;">
Loading products and shops...
</p>

</div>
`;

await Promise.all([
loadProducts(),
loadShops()
]);

showHome();

const user=
await getCurrentUser();

if(user){

await syncCloudShoppingList();
updateListCount();

}

}

startApp();

</script>
