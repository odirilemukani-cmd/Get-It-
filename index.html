 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Get-It 🇧🇼 | Find. Compare. Get.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #003f7d;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .location {
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(135deg, #003f7d, #0077b6);
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
      display: flex;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .search-box button {
      padding: 14px 20px;
      border: none;
      background: #f4c430;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      margin-bottom: 15px;
      font-size: 24px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .category-btn {
      flex-shrink: 0;
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      background: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-weight: bold;
    }

    .category-btn.active {
      background: #003f7d;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .product-icon {
      font-size: 45px;
      text-align: center;
      margin-bottom: 12px;
    }

    .product-card h3 {
      margin-bottom: 8px;
    }

    .product-card p {
      color: #666;
      margin-bottom: 6px;
    }

    .product-card button {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #003f7d;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .product-card button:hover {
      background: #002b55;
    }

    .message {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    .hidden {
      display: none;
    }

    .details-box {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .details-box h2 {
      margin-bottom: 15px;
      color: #003f7d;
    }

    .details-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .back-btn {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #555;
      color: white;
      cursor: pointer;
    }

    .compare-btn {
      background: #f4c430 !important;
      color: #222 !important;
    }

    .price-list {
      margin-top: 20px;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      margin-bottom: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .price-item.cheapest {
      border: 2px solid #198754;
      background: #eaf8ef;
    }

    .shop-name {
      font-weight: bold;
      font-size: 17px;
    }

    .shop-price {
      font-weight: bold;
      font-size: 18px;
    }

    .cheapest-label {
      display: block;
      color: #198754;
      font-size: 13px;
      margin-top: 4px;
    }

    footer {
      margin-top: 40px;
      background: #003f7d;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 26px;
      }

      .logo {
        font-size: 20px;
      }

      .location {
        font-size: 12px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-card {
        padding: 12px;
      }

      .product-icon {
        font-size: 35px;
      }

      .product-card h3 {
        font-size: 16px;
      }

      .product-card p {
        font-size: 13px;
      }

      .price-item {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Get-It 🇧🇼</div>
  <div class="location">📍 Botswana</div>
</header>

<section class="hero">
  <h1>Find. Compare. Get.</h1>
  <p>Find products and compare prices across Botswana.</p>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for a product..."
    >
    <button onclick="searchProducts()">Search</button>
  </div>
</section>

<div class="container">

  <!-- PRODUCTS SCREEN -->
  <section id="productsScreen">

    <h2 class="section-title" id="productsTitle">
      Popular Products
    </h2>

    <div class="categories">

      <button
        class="category-btn active"
        onclick="showCategory('', this)"
      >
        🛒 All
      </button>

      <button
        class="category-btn"
        onclick="showCategory('Groceries', this)"
      >
        🛒 Groceries
      </button>

      <button
        class="category-btn"
        onclick="showCategory('Electronics', this)"
      >
        📱 Electronics
      </button>

      <button
        class="category-btn"
        onclick="showCategory('Clothing', this)"
      >
        👕 Clothing
      </button>

      <button
        class="category-btn"
        onclick="showCategory('Beauty', this)"
      >
        💄 Beauty
      </button>

      <button
        class="category-btn"
        onclick="showCategory('Household', this)"
      >
        🏠 Household
      </button>

    </div>

    <div id="productsContainer" class="products">
      <div class="message">
        Loading products...
      </div>
    </div>

  </section>


  <!-- PRODUCT DETAILS SCREEN -->
  <section id="detailsScreen" class="hidden">

    <button class="back-btn" onclick="backToProducts()">
      ← Back to Products
    </button>

    <div id="productDetails" class="details-box">
    </div>

  </section>


  <!-- PRICE COMPARISON SCREEN -->
  <section id="compareScreen" class="hidden">

    <button class="back-btn" onclick="backToDetails()">
      ← Back to Product
    </button>

    <div class="details-box">

      <h2 id="compareTitle">
        Price Comparison
      </h2>

      <p id="compareSubtitle">
        Comparing prices...
      </p>

      <div id="priceContainer" class="price-list">
        <div class="message">
          Loading prices...
        </div>
      </div>

    </div>

  </section>

</div>

<footer>
  <p>© 2026 Get-It 🇧🇼</p>
  <p>Find. Compare. Get.</p>
</footer>


<script>

  /* ==============================
     SUPABASE CONNECTION
  ============================== */

  const SUPABASE_URL =
    "https://snjrlhkmixiamgqhfhug.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_3jRUAQ88ntmpnA42QwTuew_TJ7NYgFw";


  /* ==============================
     VARIABLES
  ============================== */

  let allProducts = [];
  let selectedCategory = "";
  let selectedProduct = null;


  /* ==============================
     NORMALIZE TEXT
  ============================== */

  function normalize(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, " ");
  }


  /* ==============================
     LOAD PRODUCTS
  ============================== */

  async function loadProducts() {

    const container =
      document.getElementById("productsContainer");

    container.innerHTML =
      '<div class="message">Loading products...</div>';

    try {

      const controller = new AbortController();

      const timeout = setTimeout(
        function() {
          controller.abort();
        },
        10000
      );

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            },

            signal: controller.signal
          }
        );

      clearTimeout(timeout);

      if (!response.ok) {

        throw new Error(
          "Product database error: " +
          response.status
        );

      }

      const data = await response.json();

      allProducts = Array.isArray(data)
        ? data
        : [];

      renderProducts();

    }

    catch(error) {

      console.error(error);

      container.innerHTML =
        '<div class="message">' +
        'Unable to load products. Please refresh the page.' +
        '</div>';

    }

  }


  /* ==============================
     RENDER PRODUCTS
  ============================== */

  function renderProducts() {

    const container =
      document.getElementById("productsContainer");

    const title =
      document.getElementById("productsTitle");

    const search =
      normalize(
        document.getElementById("searchInput").value
      );


    let filtered =
      allProducts.filter(function(product) {

        const category =
          normalize(product.Category);

        const name =
          normalize(product.Name);

        const brand =
          normalize(product.Brand);


        const categoryMatch =
          !selectedCategory ||
          category === normalize(selectedCategory);

        const searchMatch =
          !search ||
          name.includes(search) ||
          brand.includes(search);

        return categoryMatch && searchMatch;

      });


    if (selectedCategory) {

      title.textContent =
        selectedCategory;

    }

    else if (search) {

      title.textContent =
        "Search Results";

    }

    else {

      title.textContent =
        "Popular Products";

    }


    if (filtered.length === 0) {

      container.innerHTML =
        '<div class="message">' +
        'No products found.' +
        '</div>';

      return;

    }


    container.innerHTML =
      filtered.map(function(product) {

        const name =
          product.Name || "Unnamed Product";

        const brand =
          product.Brand || "No brand";

        const category =
          product.Category || "Other";

        const size =
          product.Size || "";


        return `

          <div class="product-card">

            <div class="product-icon">
              🛍️
            </div>

            <h3>
              ${escapeHtml(name)}
            </h3>

            <p>
              <strong>Brand:</strong>
              ${escapeHtml(brand)}
            </p>

            <p>
              <strong>Category:</strong>
              ${escapeHtml(category)}
            </p>

            ${
              size
              ? `
                <p>
                  <strong>Size:</strong>
                  ${escapeHtml(size)}
                </p>
              `
              : ""
            }

            <button
              onclick="openProduct('${escapeHtmlAttribute(
                String(product.Id || "")
              )}')"
            >
              View Product
            </button>

          </div>

        `;

      }).join("");

  }


  /* ==============================
     CATEGORY
  ============================== */

  function showCategory(category, button) {

    selectedCategory = category;

    document
      .querySelectorAll(".category-btn")
      .forEach(function(btn) {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    renderProducts();

  }


  /* ==============================
     SEARCH
  ============================== */

  function searchProducts() {

    renderProducts();

  }


  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      function() {
        renderProducts();
      }
    );


  /* ==============================
     OPEN PRODUCT
  ============================== */

  function openProduct(productId) {

    const product =
      allProducts.find(function(item) {

        return String(item.Id) ===
               String(productId);

      });


    if (!product) {

      alert("Product not found.");

      return;

    }


    selectedProduct = product;


    document
      .getElementById("productsScreen")
      .classList.add("hidden");

    document
      .getElementById("compareScreen")
      .classList.add("hidden");

    document
      .getElementById("detailsScreen")
      .classList.remove("hidden");


    const details =
      document.getElementById("productDetails");


    details.innerHTML = `

      <div class="product-icon">
        🛍️
      </div>

      <h2>
        ${escapeHtml(
          product.Name || "Unnamed Product"
        )}
      </h2>

      <div class="details-row">
        <strong>Brand:</strong>
        ${escapeHtml(product.Brand || "Not listed")}
      </div>

      <div class="details-row">
        <strong>Category:</strong>
        ${escapeHtml(product.Category || "Not listed")}
      </div>

      <div class="details-row">
        <strong>Size:</strong>
        ${escapeHtml(product.Size || "Not listed")}
      </div>

      <div class="details-row">
        <strong>Allergens:</strong>
        ${escapeHtml(product.Allergens || "Not listed")}
      </div>

      <div class="details-row">
        <strong>Ingredients:</strong>
        ${escapeHtml(product.Ingredients || "Not listed")}
      </div>

      <button
        class="product-card button compare-btn"
        onclick="comparePrices()"
        style="
          width:100%;
          margin-top:20px;
          padding:13px;
          border:none;
          border-radius:6px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        💰 Compare Prices
      </button>

    `;

  }


  /* ==============================
     COMPARE PRICES
  ============================== */

  async function comparePrices() {

    if (!selectedProduct) {
      return;
    }


    document
      .getElementById("detailsScreen")
      .classList.add("hidden");

    document
      .getElementById("compareScreen")
      .classList.remove("hidden");


    const compareTitle =
      document.getElementById("compareTitle");

    const compareSubtitle =
      document.getElementById("compareSubtitle");

    const priceContainer =
      document.getElementById("priceContainer");


    compareTitle.textContent =
      "💰 Price Comparison";

    compareSubtitle.textContent =
      selectedProduct.Name +
      " — prices across shops";


    priceContainer.innerHTML =
      '<div class="message">Loading prices...</div>';


    try {

      /* ==============================
         GET PRODUCT PRICES
      ============================== */

      const priceResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/product_prices" +
          "?select=*" +
          "&product_id=eq." +
          encodeURIComponent(
            String(selectedProduct.Id)
          ),
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!priceResponse.ok) {

        throw new Error(
          "Price database error: " +
          priceResponse.status
        );

      }


      const prices =
        await priceResponse.json();


      if (!Array.isArray(prices) ||
          prices.length === 0) {

        priceContainer.innerHTML =
          '<div class="message">' +
          'No prices available for this product yet.' +
          '</div>';

        return;

      }


      /* ==============================
         IMPORTANT FIX:
         LOAD ALL SHOPS
      ============================== */

      const shopResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/shops?select=*",
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!shopResponse.ok) {

        throw new Error(
          "Shop database error: " +
          shopResponse.status
        );

      }


      const shops =
        await shopResponse.json();


      /* ==============================
         MATCH SHOP IDs LOCALLY
      ============================== */

      const comparison =
        prices.map(function(priceItem) {

          const shop =
            shops.find(function(shopItem) {

              return String(
                shopItem.Shop_id
              ).trim() ===
              String(
                priceItem.shop_id
              ).trim();

            });


          return {

            shopName:
              shop
                ? shop.Name
                : "Unknown shop",

            location:
              shop
                ? shop.Location
                : "",

            address:
              shop
                ? shop.Address
                : "",

            price:
              Number(priceItem.price),

            available:
              priceItem.available !== false

          };

        });


      /* ==============================
         REMOVE UNAVAILABLE
      ============================== */

      const availablePrices =
        comparison.filter(function(item) {
          return item.available;
        });


      if (availablePrices.length === 0) {

        priceContainer.innerHTML =
          '<div class="message">' +
          'This product is currently unavailable.' +
          '</div>';

        return;

      }


      /* ==============================
         FIND CHEAPEST
      ============================== */

      const cheapest =
        Math.min.apply(
          null,
          availablePrices.map(function(item) {
            return item.price;
          })
        );


      /* ==============================
         SORT CHEAPEST FIRST
      ============================== */

      availablePrices.sort(
        function(a, b) {
          return a.price - b.price;
        }
      );


      /* ==============================
         DISPLAY PRICES
      ============================== */

      priceContainer.innerHTML =
        availablePrices.map(function(item) {

          const isCheapest =
            item.price === cheapest;


          return `

            <div class="
              price-item
              ${isCheapest ? "cheapest" : ""}
            ">

              <div>

                <div class="shop-name">
                  ${escapeHtml(item.shopName)}
                </div>

                ${
                  item.location
                  ? `
                    <div style="
                      font-size:13px;
                      color:#666;
                      margin-top:4px;
                    ">
                      📍 ${escapeHtml(item.location)}
                    </div>
                  `
                  : ""
                }

                ${
                  item.address
                  ? `
                    <div style="
                      font-size:12px;
                      color:#777;
                      margin-top:3px;
                    ">
                      ${escapeHtml(item.address)}
                    </div>
                  `
                  : ""
                }

                ${
                  isCheapest
                  ? `
                    <span class="cheapest-label">
                      🏆 Cheapest price
                    </span>
                  `
                  : ""
                }

              </div>

              <div class="shop-price">
                P${item.price.toFixed(2)}
              </div>

            </div>

          `;

        }).join("");


    }

    catch(error) {

      console.error(error);

      priceContainer.innerHTML =
        '<div class="message">' +
        'Unable to load price comparison. Please try again.' +
        '</div>';

    }

  }


  /* ==============================
     NAVIGATION
  ============================== */

  function backToProducts() {

    document
      .getElementById("detailsScreen")
      .classList.add("hidden");

    document
      .getElementById("compareScreen")
      .classList.add("hidden");

    document
      .getElementById("productsScreen")
      .classList.remove("hidden");

  }


  function backToDetails() {

    document
      .getElementById("compareScreen")
      .classList.add("hidden");

    document
      .getElementById("detailsScreen")
      .classList.remove("hidden");

  }


  /* ==============================
     SECURITY / HTML ESCAPING
  ============================== */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeHtmlAttribute(value) {

    return String(value || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /* ==============================
     START APP
  ============================== */

  loadProducts();

</script>

</body>
</html>
